[/Script/Engine.InputSettings]
; Usamos el sistema de entrada clásico para no depender de assets de Enhanced Input.
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
+ActionMappings=(ActionName="Interact",Key=E)
+ActionMappings=(ActionName="Menu",Key=Tab)
+ActionMappings=(ActionName="Menu",Key=Escape)
+ActionMappings=(ActionName="Click",Key=LeftMouseButton)
+ActionMappings=(ActionName="Run",Key=LeftShift)
